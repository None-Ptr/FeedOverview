name: Aggregate feeds

on:
  schedule:
    # Every 6 hours. GitHub may delay scheduled runs under load.
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Needed to commit docs/ and cache/ back to the repository.
permissions:
  contents: write

# Never let two aggregation runs race on the same feed or cache file.
concurrency:
  group: aggregate-feeds
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The spec targets Python 3.11 for CI; the code also runs on 3.14.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run aggregator
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LOG_LEVEL: INFO
        run: python -m src.main

      - name: Commit feed and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs cache
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(feed): refresh aggregated feed"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
