name: Check feeds

on:
  workflow_dispatch:
  schedule:
    # Weekly health check for feed URLs; results go to the job summary and an artifact.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe feeds from the Actions runner
        run: python tools/check_feeds.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-check
          path: feed-check.md
          if-no-files-found: warn
