# ---------------------------------------------------------------------------
# FeedOverview configuration
#
# One feed per category, plus a combined feed. Category keys are stable and
# become the file names under docs/feeds/ (News -> feeds/news.xml).
# Values here override the built-in defaults in src/config.py.
# ---------------------------------------------------------------------------

feed_title: "FeedOverview Daily"
feed_link: "https://your-username.github.io/FeedOverview/"
feed_description: "Quality English articles across 17 topics, ranked and condensed for language learners."
feed_language: "en"
output_path: "docs/feed.xml"

# Keep these in version control so incremental de-duplication survives runs.
seen_path: "cache/seen.json"
seen_retention_days: 30

# Combined feed cap. Per-category limits are below and are what actually
# controls how many articles each category publishes per run.
max_items: 200
# Hard cap of entries taken from a single source per run.
max_items_per_source: 20
# Articles published in each category feed per run.
max_items_per_category: 8
# Candidates per category handed to body extraction and ranking.
max_candidates_per_category: 32
# Keep one high-volume source from occupying every candidate slot.
max_candidates_per_source: 3

# Free-form description of what the reader cares about. Used in the ranking prompt.
interest: >-
  An advanced English learner who wants to read excellent, well-written English:
  world news, science, health, technology, business, environment, culture and
  books. Value clear prose, real reporting, concrete detail and useful
  vocabulary; avoid clickbait, listicles and press releases.

categories:
  - key: News
    label: 新闻
  - key: Science
    label: 科学
  - key: Health
    label: 健康
  - key: Tech
    label: 科技
  - key: Business
    label: 商业
  - key: Environment
    label: 环境
  - key: Food
    label: 食物
  - key: Art
    label: 艺术
  - key: Design
    label: 设计
  - key: Books
    label: 书籍文学
  - key: Ideas
    label: 思想文化
  - key: Learner
    label: 英语学习
  - key: Sports
    label: 体育
  - key: Travel
    label: 旅行
  - key: Education
    label: 教育
  - key: Policy
    label: 政策智库
  - key: Life
    label: 生活

