extract:
  timeout: 12          # seconds per HTTP request
  retries: 1           # retries after the first failure
  max_workers: 10      # concurrent feed downloads and page extractions
  user_agent: "Mozilla/5.0 (compatible; FeedAggregator/1.0; +https://github.com/) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
  fast: true           # trafilatura: skip the slower fallback extractors
  favor_recall: true   # trafilatura: prefer recall over precision
  max_content_chars: 8000   # body length kept in memory / feed
  min_content_chars: 80     # below this, treat extraction as failed and drop the article

llm:
  # api_key / base_url come from the environment (LLM_API_KEY, LLM_BASE_URL).
  # LLM_MODEL overrides this value when set.
  #
  # Zhipu BigModel (https://docs.bigmodel.cn):
  #   LLM_BASE_URL=https://open.bigmodel.cn/api/paas/v4
  #   glm-4-flash: free, fastest and most stable in testing (recommended).
  #   glm-4.7-flash is the free tier, but it is heavily loaded (429 / code 1305).
  #   glm-4.5-flash and glm-4.5-air are more stable free alternatives.
  model: "glm-4-flash"
  temperature: 0.2
  max_summary_chars: 1800   # body preview length inside the ranking prompt
  rank_batch_size: 40       # articles per ranking request
  timeout: 120              # seconds per LLM request

  # Provider-specific request fields forwarded to the API as-is.
  # GLM-4.5 models run a "thinking" pass by default, which is slow for our short
  # JSON tasks; disabling it took one ranking call from ~66s to ~7s.
  # Remove this block when using a different provider.
  extra_body:
    thinking:
      type: disabled

  ranking_criteria: |
    1. Writing quality: clear, well-structured English worth reading as a model of good prose.
    2. Substance: original reporting, evidence and concrete detail beat listicles, SEO round-ups
       and press releases.
    3. Learning value: explains an idea or a development clearly, with useful vocabulary and
       context for an English learner.
    4. Freshness: newer articles win when everything else is equal.
    5. Diversity: within a category, keep only the most valuable article per topic and avoid
       near-duplicates.

  refine:
    enabled: true
    max_input_chars: 6000     # body characters sent to the refinement call
    max_output_chars: 1100    # target (and hard) cap for the refined body
    concurrency: 4            # parallel refinement requests; 3 works on glm-4-flash, drop to 1 on 429/1302
    keep_title: true          # when true the LLM only condenses the body
    style: >
      Write concise, objective prose. Keep key data, quotes and conclusions, drop redundant
      wording and repetition. Never change facts or add information that is not in the
      source.
